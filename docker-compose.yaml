services:
  astrobot:
    build:
      context: .
    container_name: astrobot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "5000"
      DEBUG: "false"
      ARQUIVO_LEADS: /app/data/leads.json
      ARQUIVO_EVENTOS: /app/data/processed_events.json
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./data:/app/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/saude', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  astrobot-sync:
    build:
      context: .
    container_name: astrobot-sync
    restart: unless-stopped
    command: ["python", "sincronizar.py"]
    env_file:
      - .env
    environment:
      # Dispara pela rota do astrobot. Este container NÃO monta ./data
      # de propósito: só o servidor pode escrever no leads.json.
      ASTROBOT_URL: http://astrobot:5000
    depends_on:
      - astrobot
    security_opt:
      - no-new-privileges:true
